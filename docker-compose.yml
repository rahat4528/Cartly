version: '3.8'

# Cartly Root Orchestration Compose File
# Allows spinning up core infrastructure across all 12 independent e-commerce & reservation apps
# Each application has its dedicated PostgreSQL database, Redis cache, and application microservice.

networks:
  cartly_network:
    driver: bridge

services:
  # Phase 01 - Online Bookstore
  cartly_bookstore_postgres:
    image: postgres:16-alpine
    container_name: cartly_bookstore_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookstore_admin
      POSTGRES_PASSWORD: bookstore_secret
      POSTGRES_DB: cartly_bookstore
    ports:
      - "5432:5432"
    volumes:
      - bookstore_pgdata:/var/lib/postgresql/data
    networks:
      - cartly_network

  cartly_bookstore_redis:
    image: redis:7-alpine
    container_name: cartly_bookstore_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bookstore_redisdata:/data
    networks:
      - cartly_network

  # Phase 02 - Progressive Web App Store
  cartly_pwa_postgres:
    image: postgres:16-alpine
    container_name: cartly_pwa_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: pwa_admin
      POSTGRES_PASSWORD: pwa_secret
      POSTGRES_DB: cartly_pwa_store
    ports:
      - "5433:5432"
    volumes:
      - pwa_pgdata:/var/lib/postgresql/data
    networks:
      - cartly_network

  cartly_pwa_redis:
    image: redis:7-alpine
    container_name: cartly_pwa_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - pwa_redisdata:/data
    networks:
