version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cartly-house-rental-db
    environment:
      POSTGRES_DB: cartly_house_rental_db
      POSTGRES_USER: cartly_user
      POSTGRES_PASSWORD: cartly_password
    ports:
      - "5441:5432"
    volumes:
      - rental_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cartly-house-rental-redis
    ports:
      - "6388:6379"

volumes:
  rental_postgres_data:
