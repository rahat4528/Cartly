version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cartly_job_board_postgres
    environment:
      POSTGRES_USER: cartly
      POSTGRES_PASSWORD: cartly_secure_password
      POSTGRES_DB: cartly_job_board_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_job_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartly -d cartly_job_board_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cartly_job_board_redis
    ports:
      - "6381:6379"
    volumes:
      - redis_job_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_job_data:
  redis_job_data:
