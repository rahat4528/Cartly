version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cartly_car_rental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cartly_car_rental_db
    ports:
      - "5439:5432"
    volumes:
      - car_rental_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cartly_car_rental_redis
    restart: unless-stopped
    ports:
      - "6386:6379"
    volumes:
      - car_rental_redisdata:/data

volumes:
  car_rental_pgdata:
  car_rental_redisdata:
