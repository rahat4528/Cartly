version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cartly-flight-booking-db
    environment:
      POSTGRES_DB: cartly_flight_booking_db
      POSTGRES_USER: cartly_user
      POSTGRES_PASSWORD: cartly_password
    ports:
      - "5444:5432"
    volumes:
      - flight_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cartly-flight-booking-redis
    ports:
      - "6391:6379"

volumes:
  flight_postgres_data:
