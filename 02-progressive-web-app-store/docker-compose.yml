version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cartly_pwa_store_postgres
    environment:
      POSTGRES_USER: cartly
      POSTGRES_PASSWORD: cartly_secure_password
      POSTGRES_DB: cartly_pwa_store_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_pwa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartly -d cartly_pwa_store_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cartly_pwa_store_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_pwa_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_pwa_data:
  redis_pwa_data:
