<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Cartly PWA Store</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      box-sizing: border-box;
      padding: 24px;
    }
    .badge {
      display: inline-block;
      background: rgba(6, 182, 212, 0.15);
      color: #06B6D4;
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 12px 0;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.6;
      max-width: 420px;
      margin: 0 auto 24px auto;
    }
    .btn {
      background: #06B6D4;
      color: #0F172A;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #0891B2;
    }
  </style>
</head>
<body>
  <div class="badge">Offline Experience Active</div>
  <h1>No Network Connection</h1>
  <p>
    You are currently browsing without internet. Any products you add to your bag or save to your wishlist are preserved in the offline pending queue and will sync automatically when your connectivity is restored.
  </p>
  <button class="btn" onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
