version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cartly_restaurant_reservation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cartly_restaurant_reservation_db}
    ports:
      - "${DB_PORT:-5436}:5432"
    volumes:
      - restaurant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cartly_restaurant_reservation_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cartly_restaurant_reservation_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6383}:6379"
    volumes:
      - restaurant_redis_data:/data

volumes:
  restaurant_postgres_data:
  restaurant_redis_data:
